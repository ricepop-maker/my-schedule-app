<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인 일정 스케줄 관리</title>
<script>
  // 다크 모드 깜빡임 방지: 스타일시트 적용 전에 먼저 테마 속성을 지정
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 로그인 / 회원가입 화면 -->
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1 class="auth-title">내 일정 관리</h1>
    <p class="auth-subtitle">로그인하고 내 일정을 확인하세요</p>

    <form id="authForm">
      <label class="field">
        <span>이메일</span>
        <input type="email" id="authEmail" required placeholder="you@example.com">
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input type="password" id="authPassword" required placeholder="비밀번호 (6자 이상)">
      </label>

      <p id="authError" class="auth-error hidden"></p>

      <div class="auth-actions">
        <button type="submit" id="loginBtn" class="primary-btn auth-btn">로그인</button>
        <button type="button" id="signupBtn" class="secondary-btn auth-btn">회원가입</button>
      </div>
      <span id="emailRecentBadge" class="recent-badge hidden">최근에 사용함</span>
    </form>

    <div class="auth-divider"><span>또는</span></div>

    <button type="button" id="googleLoginBtn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      <span>구글 로그인</span>
      <span id="googleRecentBadge" class="recent-badge hidden">최근에 사용함</span>
    </button>
  </div>
</section>

<!-- Firebase SDK (호환 버전 — file://로 직접 열어도 동작하도록 일반 스크립트로 로드) -->
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
